url: https://johngavin.github.io/footbet/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    preset: "shiny"
  includes:
    in_header: |
      <script>localStorage.setItem('theme','dark');document.documentElement.setAttribute('data-bs-theme','dark');</script>
      <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600&display=swap" rel="stylesheet">
    after_body: |
      <script>
        fetch(window.location.href, {method: 'HEAD'}).then(function(r) {
          var lm = r.headers.get('Last-Modified');
          if (lm) {
            document.querySelectorAll('.pkgdown-footer-left p').forEach(function(el) {
              el.textContent = 'Deployed: ' + lm;
            });
          }
        });
      </script>

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/JohnGavin/footbet
      aria-label: GitHub repository

reference:
  - title: Data Acquisition
    desc: Download and parse match data from various sources
    contents:
      - has_concept("data-acquisition")
  - title: Data Integration
    desc: Join and transform data from multiple sources
    contents:
      - has_concept("data")
  - title: Feature Engineering
    desc: Create predictive features from raw match data
    contents:
      - has_concept("features")
  - title: Odds Conversion
    desc: Convert between decimal, fractional, and American odds formats
    contents:
      - has_concept("odds")
  - title: Devigging Odds
    desc: Remove bookmaker margin from odds
    contents:
      - has_concept("devig")
  - title: Prediction Models
    desc: Fit and predict with Poisson, Dixon-Coles, and Bayesian models
    contents:
      - has_concept("models")
  - title: Model Evaluation
    desc: Evaluate model performance and calibration
    contents:
      - has_concept("evaluation")
  - title: Probability Calibration
    desc: Platt scaling and isotonic regression for calibrating probabilities
    contents:
      - has_concept("calibration")
  - title: Meta-Analytics
    desc: Discrimination and stability metrics for statistic evaluation
    contents:
      - has_concept("meta-analytics")
  - title: Betting Strategy
    desc: Kelly criterion and bankroll management
    contents:
      - has_concept("decisions")
  - title: Accumulators & Bankroll
    desc: Accumulator bets and bankroll simulation
    contents:
      - has_concept("betting")
  - title: Simulation
    desc: Monte Carlo simulation for accumulators and rare events
    contents:
      - has_concept("simulation")
  - title: Database
    desc: DuckDB storage and retrieval
    contents:
      - has_concept("storage")
  - title: Visualization
    desc: Interactive plotly visualizations with dark theme
    contents:
      - has_concept("plotting")
  - title: Utilities
    desc: Helper functions
    contents:
      - has_concept("utilities")
  - title: Diagrams
    desc: Auto-generated mermaid flowcharts for documentation
    contents:
      - has_concept("diagrams")

articles:
  - title: Guide
    navbar: Guide
    contents:
      - data-sources
      - data-cleaning
      - eda
      - models-betting
      - ah-backtest
  - title: Reference
    contents:
      - glossary
