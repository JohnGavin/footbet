url: https://johngavin.github.io/footbet/

template:
  bootstrap: 5
  bslib:
    preset: "shiny"
  includes:
    in_header: |
      <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600&display=swap" rel="stylesheet">

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/JohnGavin/footbet

reference:
  - title: Data Acquisition
    desc: Download and parse match data from various sources
    contents:
      - has_concept("data-acquisition")
  - title: Data Integration
    desc: Join and transform data from multiple sources
    contents:
      - has_concept("data")
  - title: Feature Engineering
    desc: Create predictive features from raw match data
    contents:
      - has_concept("features")
  - title: Odds Conversion
    desc: Convert between decimal, fractional, and American odds formats
    contents:
      - has_concept("odds")
  - title: Devigging Odds
    desc: Remove bookmaker margin from odds
    contents:
      - has_concept("devig")
  - title: Prediction Models
    desc: Fit and predict with Poisson, Dixon-Coles, and Bayesian models
    contents:
      - has_concept("models")
  - title: Model Evaluation
    desc: Evaluate model performance and calibration
    contents:
      - has_concept("evaluation")
  - title: Betting Strategy
    desc: Kelly criterion and bankroll management
    contents:
      - has_concept("decisions")
  - title: Accumulators & Bankroll
    desc: Accumulator bets and bankroll simulation
    contents:
      - has_concept("betting")
  - title: Simulation
    desc: Monte Carlo simulation for accumulators and rare events
    contents:
      - has_concept("simulation")
  - title: Database
    desc: DuckDB storage and retrieval
    contents:
      - has_concept("storage")
  - title: Utilities
    desc: Helper functions
    contents:
      - has_concept("utilities")

articles:
  - title: Data Pipeline
    navbar: Data Pipeline
    contents:
      - data-sources
      - data-cleaning
  - title: Analysis
    navbar: Analysis
    contents:
      - eda
      - model-fitting
  - title: Reference
    navbar: Reference
    contents:
      - betting-glossary
