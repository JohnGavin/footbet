name: Deploy pkgdown site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          logger: pretty
          log-directives: nix_installer=trace
          backtrace: full

      - name: Setup magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup Cachix (rstats-on-nix + johngavin)
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix
          extraPullNames: johngavin

      - name: Build project Nix environment
        run: nix-build default.nix -A shell --no-out-link

      - name: Render README
        run: |
          nix-shell default.nix -A shell --run "quarto render README.qmd --to gfm"

      - name: Run targets pipeline
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            # Build vignette targets (vig_*) required for pkgdown site
            targets::tar_make(names = tidyselect::starts_with(\"vig_\"))
          '"

      - name: Build pkgdown site
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            devtools::document()
            pkgdown::build_site(preview = FALSE)
          '"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
